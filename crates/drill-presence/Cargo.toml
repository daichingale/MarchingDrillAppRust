[package]
name = "drill-presence"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
drill-core = { path = "../drill-core" }
serde.workspace = true
serde_json.workspace = true
# Synchronous WebSocket. `tokio-tungstenite` is deliberately NOT used: this
# workspace has no async runtime anywhere (drill-updater even hand-rolls
# WinHTTP to avoid one), and presence traffic is a handful of small frames per
# second. A blocking socket on a dedicated thread matches drill-jobs' existing
# `Job<T>` concurrency model exactly.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[[bin]]
name = "drill-presence-relay"
path = "src/bin/relay.rs"
