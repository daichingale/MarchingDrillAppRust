<!DOCTYPE html>
<html lang="ja" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>DrillForge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f6f8;
        overflow: hidden;
        box-sizing: border-box;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="drillforge"></canvas>
    <script type="module">
      import init, { WebHandle } from "./pkg/drill_web.js";
      await init();
      const app = new WebHandle();
      await app.start(document.getElementById("drillforge"));
    </script>
  </body>
</html>
