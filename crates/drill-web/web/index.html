<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DrillForge</title>
  <link rel="stylesheet" href="./editor.css">
</head>
<body>
  <header>
    <strong>DrillForge</strong>
    <button id="library-toggle" type="button" disabled>作品一覧</button>
    <button id="add-set" type="button" disabled>セット追加</button>
    <span id="status" role="status">エディターを起動中…</span>
  </header>
  <dialog id="library" aria-labelledby="library-title">
    <form method="dialog"><button type="submit" aria-label="作品一覧を閉じる">閉じる</button></form>
    <h1 id="library-title">このブラウザの作品</h1>
    <form id="create">
      <label for="title">作品名</label>
      <input id="title" maxlength="120" required>
      <label for="performers">人数</label>
      <input id="performers" type="number" value="8" min="1" max="4000" required>
      <button type="submit">新規作成</button>
    </form>
    <label for="import">DrillForge ファイルを読み込む</label>
    <input id="import" type="file" accept=".json,.drill,.drillforge,application/json">
    <ul id="projects"></ul>
    <button type="button" id="export">編集中の作品を書き出す</button>
    <p id="library-status" role="status"></p>
  </dialog>
  <dialog id="set-dialog" aria-labelledby="set-title">
    <h2 id="set-title">最後の隊形をコピー</h2>
    <form id="set-form">
      <label for="counts">カウント数</label>
      <input id="counts" type="number" value="16" min="1" max="256" required>
      <button type="submit">追加</button>
      <button type="submit" formmethod="dialog" formnovalidate>閉じる</button>
    </form>
  </dialog>
  <canvas id="drillforge" aria-label="ドリル編集フィールド"></canvas>
  <script type="module" src="./editor.mjs"></script>
</body>
</html>
