<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>DrillForge</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #102818;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="drillforge"></canvas>
    <script type="module">
      import init, { WebHandle } from "./pkg/drill_web.js";
      await init();
      const app = new WebHandle();
      await app.start(document.getElementById("drillforge"));
    </script>
  </body>
</html>
